name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - name: Install
        run: npm ci
      - name: Test
        run: npm test

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - name: Install
        run: npm ci
      - name: Coverage
        run: npm run coverage

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - name: Install
        run: npm ci
      - name: Integration tests
        run: npm run test:integration

  e2e-fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - name: Install
        run: npm ci
      - name: E2E fixture tests
        run: npm run test:e2e

  eval-alpha:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - name: Install
        run: npm ci
      - name: Run offline alpha eval gate
        run: npm run eval:alpha
      - name: Upload eval report artifact
        uses: actions/upload-artifact@v4
        with:
          name: eval-alpha-report
          path: .out/evals/*.json
          if-no-files-found: error

  eval-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - name: Install
        run: npm ci
      - name: Run offline safety eval gate
        run: npm run eval:safety
      - name: Upload safety eval report artifact
        uses: actions/upload-artifact@v4
        with:
          name: eval-safety-report
          path: .out/evals/*.json
          if-no-files-found: error

  eval-v2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - name: Install
        run: npm ci
      - name: Seed telemetry sample (CI baseline)
        run: npm run telemetry:seed
      - name: Run eval v2 gate
        run: npm run eval:v2 -- --require-online
      - name: Validate online telemetry volume
        run: npm run telemetry:check-volume
      - name: Upload eval v2 report artifact
        uses: actions/upload-artifact@v4
        with:
          name: eval-v2-report
          path: .out/evals/eval-v2-*.json
          if-no-files-found: error

  sbom:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - name: Install
        run: npm ci
      - name: Generate CycloneDX SBOM
        run: npm run sbom:generate
      - name: Generate provenance pilot
        run: npm run provenance:generate
      - name: Verify supply-chain evidence
        run: npm run supply-chain:verify
      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx
          path: .out/sbom/cyclonedx-npm.json
          if-no-files-found: error
      - name: Upload provenance artifact
        uses: actions/upload-artifact@v4
        with:
          name: provenance-pilot
          path: .out/provenance/*.json
          if-no-files-found: error
      - name: Attest SBOM provenance (SLSA pilot)
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: .out/sbom/cyclonedx-npm.json

  iac-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.5
      - name: Validate IaC baseline
        run: npm run iac:validate

  cost-governance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - name: Install
        run: npm ci
      - name: Cost report
        run: npm run cost:report
      - name: Cost budget check
        run: npm run cost:budget
      - name: Upload cost report artifact
        uses: actions/upload-artifact@v4
        with:
          name: cost-report
          path: .out/cost/*

  workflow-governance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - name: Install
        run: npm ci
      - name: Verify workflow governance invariants
        run: npm run workflow:governance

  data-governance-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - name: Install
        run: npm ci
      - name: Validate data governance policy
        run: npm run policy:data-governance

  security-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - name: Install
        run: npm ci
      - name: npm audit (high+)
        run: npm audit --audit-level=high
