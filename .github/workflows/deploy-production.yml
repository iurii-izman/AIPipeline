name: Deploy Production

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref to deploy'
        required: false
        default: 'main'
      confirm_production:
        description: 'Type DEPLOY to confirm production deployment'
        required: true
        default: 'DEPLOY'
      allow_dry_run:
        description: 'Allow explicit dry-run when deploy webhook/token is missing'
        required: false
        default: false
        type: boolean
  push:
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  validate:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || vars.AUTO_DEPLOY_PRODUCTION == 'true' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Test
        run: npm test

  deploy:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    needs: [validate]
    if: >-
      ${{
        (github.event_name == 'workflow_dispatch' && inputs.confirm_production == 'DEPLOY') ||
        (github.event_name == 'push' && vars.AUTO_DEPLOY_PRODUCTION == 'true')
      }}
    environment:
      name: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - name: Resolve deploy metadata
        id: meta
        run: |
          echo "ref_name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          echo "sha_short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - name: Deploy via webhook (strict contract)
        id: deploy
        env:
          DEPLOY_WEBHOOK_PRODUCTION: ${{ secrets.DEPLOY_WEBHOOK_PRODUCTION }}
          DEPLOY_WEBHOOK_TOKEN_PRODUCTION: ${{ secrets.DEPLOY_WEBHOOK_TOKEN_PRODUCTION }}
          ALLOW_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.allow_dry_run || 'false' }}
        run: |
          if [[ -z "$DEPLOY_WEBHOOK_PRODUCTION" || -z "$DEPLOY_WEBHOOK_TOKEN_PRODUCTION" ]]; then
            if [[ "$ALLOW_DRY_RUN" == "true" ]]; then
              echo "dry_run=true" >> "$GITHUB_OUTPUT"
              echo "deploy_mode=dry-run-explicit" >> "$GITHUB_OUTPUT"
              echo "Explicit dry-run requested (missing DEPLOY_WEBHOOK_PRODUCTION or DEPLOY_WEBHOOK_TOKEN_PRODUCTION)."
              exit 0
            fi
            echo "Deploy contract violation: DEPLOY_WEBHOOK_PRODUCTION and DEPLOY_WEBHOOK_TOKEN_PRODUCTION are required."
            exit 1
          fi
          echo "dry_run=false" >> "$GITHUB_OUTPUT"
          echo "deploy_mode=webhook" >> "$GITHUB_OUTPUT"
          PAYLOAD=$(cat <<JSON
          {
            "environment":"production",
            "repository":"${{ github.repository }}",
            "ref":"${{ steps.meta.outputs.ref_name }}",
            "sha":"${{ github.sha }}",
            "actor":"${{ github.actor }}",
            "run_url":"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          }
          JSON
          )
          curl -fsSL --retry 3 --retry-all-errors --retry-delay 5 --connect-timeout 10 --max-time 30 -X POST "$DEPLOY_WEBHOOK_PRODUCTION" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $DEPLOY_WEBHOOK_TOKEN_PRODUCTION" \
            -d "$PAYLOAD"
      - name: Post-deploy smoke check (optional)
        if: ${{ steps.deploy.outputs.dry_run != 'true' }}
        env:
          DEPLOY_POSTCHECK_URL_PRODUCTION: ${{ vars.DEPLOY_POSTCHECK_URL_PRODUCTION }}
          STATUS_AUTH_TOKEN: ${{ secrets.STATUS_AUTH_TOKEN }}
        run: |
          if [[ -z "$DEPLOY_POSTCHECK_URL_PRODUCTION" ]]; then
            echo "Post-deploy smoke: skipped (DEPLOY_POSTCHECK_URL_PRODUCTION is not configured)"
            exit 0
          fi
          auth_args=()
          if [[ -n "$STATUS_AUTH_TOKEN" ]]; then
            auth_args=(-H "Authorization: Bearer $STATUS_AUTH_TOKEN")
          fi
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 5 --connect-timeout 10 --max-time 30 \
            "${auth_args[@]}" \
            "$DEPLOY_POSTCHECK_URL_PRODUCTION"
      - name: Deployment summary
        run: |
          {
            echo "### Production deploy"
            echo "- Ref: \`${{ steps.meta.outputs.ref_name }}\`"
            echo "- SHA: \`${{ steps.meta.outputs.sha_short }}\`"
            echo "- Mode: \`${{ steps.deploy.outputs.deploy_mode || 'unknown' }}\`"
            if [[ "${{ steps.deploy.outputs.dry_run }}" == "true" ]]; then
              echo "- Smoke: skipped (dry-run)"
            else
              echo "- Smoke: executed (if DEPLOY_POSTCHECK_URL_PRODUCTION configured)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
